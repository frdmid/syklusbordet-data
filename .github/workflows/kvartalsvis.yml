name: Kvartalsvis tilbudsskår

on:
  schedule:
    - cron: "0 7 5 2,5,8,11 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tilbud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Capex mot avskrivninger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tilbud_b.py
