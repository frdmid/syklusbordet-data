# Sondene. Kjorer bare naar du trykker paa knappen, aldri paa timeplan.
#
# De skriver ingenting til dashbordet. De maaler hva som finnes av data og
# legger hele utskriften i mappen sonder/ i dette repoet, slik at Claude kan
# lese resultatet selv uten at du maa kopiere noe.
#
# Diagnosen skriver i tillegg bdi_hist.json og etterspørsel.json, som er
# ferdige data og ikke sondering.

name: Sonder

on:
  workflow_dispatch:
    inputs:
      hvilken:
        description: "Hvilken sonde"
        required: true
        default: "alle"
        type: choice
        options: [alle, diagnose, "C og D", korrelasjon, esef, "ad hoc"]

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p sonder

      - name: Diagnose 2.5 (aldersvekting, BDI, OWID)
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'diagnose'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sonde_diagnose.py 2>&1 | tee sonder/diagnose.txt

      - name: Sonde C og D
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'C og D'
        run: python sonde_cd.py 2>&1 | tee sonder/c_og_d.txt

      - name: Korrelasjon instrument mot raavare
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'korrelasjon'
        run: python sonde_korrelasjon.py 2>&1 | tee sonder/korrelasjon.txt

      - name: Hvor finnes regnskap for de 20 uten SEC
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'esef'
        run: python sonde_esef.py 2>&1 | tee sonder/esef.txt

      # Fritt steg. Kjorer sonde_ad_hoc.py hvis den finnes.
      #
      # Arbeidsflytfiler er beskyttet mot fjernskriving, saa hver gang en ny
      # sonde trengte et eget steg, maatte Frode legge inn en ny yml manuelt.
      # Det gikk galt 24. september: skriptet laa i repoet, steget gjorde ikke,
      # og kjoringen saa vellykket ut mens den hoppet over hele sonden.
      # Med dette steget skriver Claude bare sonde_ad_hoc.py, og denne filen
      # trenger aldri roeres igjen.
      - name: Ad hoc
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'ad hoc'
        run: |
          if [ -f sonde_ad_hoc.py ]; then
            python sonde_ad_hoc.py 2>&1 | tee sonder/ad_hoc.txt
          else
            echo "ingen sonde_ad_hoc.py i repoet, hopper over"
          fi

      - name: Legg utskriften i repoet
        if: always()
        run: |
          git config user.name "syklusbordet"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add -A sonder/
          git diff --cached --quiet && echo "ingen ny utskrift" && exit 0
          git commit -m "sonderesultat $(date -u +%Y-%m-%dT%H:%M)"
          git push
