name: Sonder

on:
  workflow_dispatch:
    inputs:
      hvilken:
        description: "Hvilken sonde"
        required: true
        default: "alle"
        type: choice
        options: [alle, diagnose, "C og D", korrelasjon]

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdir -p sonder

      - name: Diagnose 2.5
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'diagnose'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sonde_diagnose.py 2>&1 | tee sonder/diagnose.txt

      - name: Sonde C og D
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'C og D'
        run: python sonde_cd.py 2>&1 | tee sonder/c_og_d.txt

      - name: Korrelasjon instrument mot raavare
        if: inputs.hvilken == 'alle' || inputs.hvilken == 'korrelasjon'
        run: python sonde_korrelasjon.py 2>&1 | tee sonder/korrelasjon.txt

      - name: Legg utskriften i repoet
        if: always()
        run: |
          git config user.name "syklusbordet"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add -A sonder/
          git diff --cached --quiet && echo "ingen ny utskrift" && exit 0
          git commit -m "sonderesultat $(date -u +%Y-%m-%dT%H:%M)"
          git push
