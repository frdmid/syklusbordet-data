# Ukentlig innhenting til Syklusbordet.
#
# Denne filen ER arbeidsflyten. Den ble lenge vedlikeholdt som et forslag i
# notater/ukentlig_forslag.yml fordi Claude Code ikke fikk endre
# .github/workflows/; den sperren ble loftet 12.11.2026, og forslagsfila er
# dermed pensjonert. Historikken ligger i git og i notater/LOGG.md.
#
# TIDENE: TOLV FORSOEK, EN HVER TIME (25.11.2026, Frodes bestilling om at det
# skal gaa av seg selv). GitHub starter planlagte kjoringer for gratis,
# offentlige repoer naar det er plass, ikke paa klokkeslettet, og de kan droppes
# helt. 28.10, 04.11 og 11.11 kom de 6,5 til 9 timer for sent (15:31 til 17:39
# norsk tid) og bare to av tidene hver gang. 25.11, med fire tider natt til
# onsdag, kom INGEN: kl. 08:32 var det ikke laget noen kjoring i det hele tatt,
# og ukens tall maatte startes for haand, som de tre ukene for.
#
# Derfor er faa, presise tider byttet ut med mange. Cron "48 0-11 * * 3" fyrer
# tolv ganger onsdag, 00:48 til 11:48 UTC, altsaa 01:48 til 12:48 norsk
# vintertid (en time senere om sommeren). Alle tolv er onsdag baade i UTC og
# norsk tid, slik at Shadow-OOS (som regner dato i UTC, uken fra onsdag) og
# vakta (norsk dato) er enige. Poenget er ikke at en bestemt time treffer, men
# at EN av tolv kommer igjennom: et droppet eller forsinket klokkeslett koster
# ingenting naar det er elleve andre.
#
# Prisen er null. Vakta gjor de overflodige til ingenting: den forste
# kjoringen skriver index.json, de neste stopper etter vaktjobben i 10 til 14
# sekunder. Tolv forsoek er altsaa en full kjoring pluss rundt to minutter
# maskintid i uka, godt innenfor det gratis for offentlige repoer.
#
# Kildene er forrige dags sluttkurser, maanedstall og Fearnleys-rapporten fra
# uken foer, saa tallene blir de samme uansett hvilken av de tolv som kommer
# forst. Tidligere tider: 08:48 og 09:56 (21.10 til 11.11), 07:48 vinter og
# 08:48 sommer (12.11 til 17.11), fire tider natt til onsdag (18.11 til 25.11).
#
# I TILLEGG er det en vakthund utenfor GitHub: rutinen «Syklusbordet: vakthund
# for ukentlig innhenting» ser onsdag kl. 08:45 norsk tid om index.json er fra
# i dag, og sier fra per e-post hvis den ikke er det. Den kan ogsaa starte
# kjoringen selv hvis miljovariabelen GH_DISPATCH_TOKEN er satt. Se
# notater/LOGG.md 25.11.2026.
#
# AVHENGIGHETENE. Hvert installasjonssteg har en reserve, fordi en manglende
# hjulfil ellers stopper hele onsdagen. Reserven leser pakkenavnene UT AV
# requirements.txt, saa en ny pakke der ikke blir glemt i reserven, og den
# skriver ::warning:: slik at bruk av reserven synes i kjoringens sammendrag og
# ikke bare i stegloggen. requirements.txt har ovre grenser og ikke eksakte
# pinner; naa som reserven finnes, kan de strammes, men det er Frodes valg.
# Hva som faktisk kjorte, staar i logg/miljo.csv, med avvik mot
# config/miljo_kjent.json.
#
# VAKTA. Jobben under (vakt_ukentlig.py) lar de senere tidene hoppe over hvis
# index.json allerede er skrevet i dag. Startet for haand kjorer alltid.
# «concurrency» sier at en ny kjoring venter til en paagaaende er ferdig, saa
# reserven aldri gaar samtidig med en forsinket hovedkjoring.
#
# Ukentlig innhenting til Syklusbordet.
#
# Kjorer paa GitHub sine egne maskiner, ikke i Colab. Gratis for offentlige
# repoer. Skriver tilbake til dette repoet med den innebygde token-en, saa
# ingen hemmelighet maa settes opp manuelt.
#
# Onsdag er valgt fordi Fearnleys publiserer tidlig i uka og Verdensbankens
# Pink Sheet kommer de forste virkedagene i maaneden.

name: Ukentlig innhenting

on:
  schedule:
    # Tolv forsoek onsdag, ett hver time: 00:48 til 11:48 UTC, altsaa 01:48 til
    # 12:48 norsk vintertid (02:48 til 13:48 sommertid). Alle er onsdag i baade
    # UTC og norsk tid. Vakta slipper bare den foerste gjennom; de elleve andre
    # stopper etter vaktjobben. Mange forsoek, fordi GitHub dropper og
    # forsinker planlagte kjoringer: se toppen av fila.
    - cron: "48 0-11 * * 3"
  workflow_dispatch:            # og naar du trykker paa knappen selv

permissions:
  contents: write               # lar jobben skrive JSON-filene tilbake

concurrency:
  group: ukentlig-innhenting
  cancel-in-progress: false     # en ny kjoering venter, den avbryter ikke

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kjor: ${{ steps.vakt.outputs.kjor }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: vakt
        name: Har ukens kjoering allerede gaatt?
        run: python vakt_ukentlig.py

  kapitulasjon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: vakt
    if: needs.vakt.outputs.kjor == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Avhengigheter, med reserve
        run: |
          if pip install -r requirements.txt; then
            exit 0
          fi
          echo "::warning::pip install -r requirements.txt feilet. Faller tilbake til \
          installasjon uten versjonskrav. Se logg/miljo.csv for hva som faktisk ble \
          installert, og config/miljo_kjent.json for hva som er kjent godt."
          pip install $(sed -E 's/[<>=!].*//' requirements.txt | grep -vE '^[[:space:]]*(#|$)')
      - name: Kapitulasjon D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python kapitulasjon_d.py

  priser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: kapitulasjon        # D maa ligge i repoet foer priser.py leser den
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Avhengigheter, med reserve
        run: |
          if pip install -r requirements.txt; then
            exit 0
          fi
          echo "::warning::pip install -r requirements.txt feilet. Faller tilbake til \
          installasjon uten versjonskrav. Se logg/miljo.csv for hva som faktisk ble \
          installert, og config/miljo_kjent.json for hva som er kjent godt."
          pip install $(sed -E 's/[<>=!].*//' requirements.txt | grep -vE '^[[:space:]]*(#|$)')
      - name: Priser, 24 segmenter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python priser.py

  shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: priser               # sist i koen, saa ingen to skriver samtidig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Avhengigheter, med reserve
        run: |
          if pip install -r requirements.txt; then
            exit 0
          fi
          echo "::warning::pip install -r requirements.txt feilet. Faller tilbake til \
          installasjon uten versjonskrav. Se logg/miljo.csv for hva som faktisk ble \
          installert, og config/miljo_kjent.json for hva som er kjent godt."
          pip install $(sed -E 's/[<>=!].*//' requirements.txt | grep -vE '^[[:space:]]*(#|$)')
      - name: Fearnleys ukerapporter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python shipping.py
      - name: Bygg shipping-segmentene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bygg_shipping.py
