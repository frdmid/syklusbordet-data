# Ukentlig innhenting til Syklusbordet.
#
# Denne filen ER arbeidsflyten. Den ble lenge vedlikeholdt som et forslag i
# notater/ukentlig_forslag.yml fordi Claude Code ikke fikk endre
# .github/workflows/; den sperren ble loftet 12.11.2026, og forslagsfila er
# dermed pensjonert. Historikken ligger i git og i notater/LOGG.md.
#
# TIDENE. Fire cron-tider, to for hver aarstid, saa filen virker baade ved
# vintertid og sommertid uten aa flyttes for haand. GitHub regner cron i UTC.
# Vakta gjor de overflodige til ingenting: den forste kjoringen skriver
# index.json, og de neste stopper etter vaktjobben. I praksis:
#     vinter   07:48 hovedkjoring, 09:56 reserve
#     sommer   08:48 hovedkjoring, 09:56 reserve
# At vinterkjoringen er en time tidligere enn den var, er harmlost: alle
# kildene er forrige dags sluttkurser eller maanedstall, og onsdagsrutinen gaar
# forst 10:15. Regnet om med zoneinfo av to okter uavhengig, 12.11.2026.
#
# AVHENGIGHETENE. Hvert installasjonssteg har en reserve, fordi en manglende
# hjulfil ellers stopper hele onsdagen. Reserven leser pakkenavnene UT AV
# requirements.txt, saa en ny pakke der ikke blir glemt i reserven, og den
# skriver ::warning:: slik at bruk av reserven synes i kjoringens sammendrag og
# ikke bare i stegloggen. requirements.txt har ovre grenser og ikke eksakte
# pinner; naa som reserven finnes, kan de strammes, men det er Frodes valg.
# Hva som faktisk kjorte, staar i logg/miljo.csv, med avvik mot
# config/miljo_kjent.json.
#
# VAKTA. Jobben under (vakt_ukentlig.py) lar de senere tidene hoppe over hvis
# index.json allerede er skrevet i dag. Startet for haand kjorer alltid.
# «concurrency» sier at en ny kjoring venter til en paagaaende er ferdig, saa
# reserven aldri gaar samtidig med en forsinket hovedkjoring.
#
# Ukentlig innhenting til Syklusbordet.
#
# Kjorer paa GitHub sine egne maskiner, ikke i Colab. Gratis for offentlige
# repoer. Skriver tilbake til dette repoet med den innebygde token-en, saa
# ingen hemmelighet maa settes opp manuelt.
#
# Onsdag er valgt fordi Fearnleys publiserer tidlig i uka og Verdensbankens
# Pink Sheet kommer de forste virkedagene i maaneden.

name: Ukentlig innhenting

on:
  schedule:
    # Fire tider, to for hver aarstid. Vakta slipper bare den foerste gjennom.
    - cron: "48 6 * * 3"       # 08:48 norsk sommertid (07:48 vintertid)
    - cron: "48 7 * * 3"       # 08:48 norsk vintertid (09:48 sommertid)
    - cron: "56 7 * * 3"       # 09:56 norsk sommertid, reserve (08:56 vintertid)
    - cron: "56 8 * * 3"       # 09:56 norsk vintertid, reserve (10:56 sommertid)
  workflow_dispatch:            # og naar du trykker paa knappen selv

permissions:
  contents: write               # lar jobben skrive JSON-filene tilbake

concurrency:
  group: ukentlig-innhenting
  cancel-in-progress: false     # en ny kjoering venter, den avbryter ikke

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kjor: ${{ steps.vakt.outputs.kjor }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: vakt
        name: Har ukens kjoering allerede gaatt?
        run: python vakt_ukentlig.py

  kapitulasjon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: vakt
    if: needs.vakt.outputs.kjor == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Avhengigheter, med reserve
        run: |
          if pip install -r requirements.txt; then
            exit 0
          fi
          echo "::warning::pip install -r requirements.txt feilet. Faller tilbake til \
          installasjon uten versjonskrav. Se logg/miljo.csv for hva som faktisk ble \
          installert, og config/miljo_kjent.json for hva som er kjent godt."
          pip install $(sed -E 's/[<>=!].*//' requirements.txt | grep -vE '^[[:space:]]*(#|$)')
      - name: Kapitulasjon D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python kapitulasjon_d.py

  priser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: kapitulasjon        # D maa ligge i repoet foer priser.py leser den
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Avhengigheter, med reserve
        run: |
          if pip install -r requirements.txt; then
            exit 0
          fi
          echo "::warning::pip install -r requirements.txt feilet. Faller tilbake til \
          installasjon uten versjonskrav. Se logg/miljo.csv for hva som faktisk ble \
          installert, og config/miljo_kjent.json for hva som er kjent godt."
          pip install $(sed -E 's/[<>=!].*//' requirements.txt | grep -vE '^[[:space:]]*(#|$)')
      - name: Priser, 24 segmenter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python priser.py

  shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: priser               # sist i koen, saa ingen to skriver samtidig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Avhengigheter, med reserve
        run: |
          if pip install -r requirements.txt; then
            exit 0
          fi
          echo "::warning::pip install -r requirements.txt feilet. Faller tilbake til \
          installasjon uten versjonskrav. Se logg/miljo.csv for hva som faktisk ble \
          installert, og config/miljo_kjent.json for hva som er kjent godt."
          pip install $(sed -E 's/[<>=!].*//' requirements.txt | grep -vE '^[[:space:]]*(#|$)')
      - name: Fearnleys ukerapporter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python shipping.py
      - name: Bygg shipping-segmentene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bygg_shipping.py
