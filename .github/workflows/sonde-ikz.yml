# Eksplorativ instrumentsonde for IKZ-universet.
#
# Kjores bare naar du trykker paa knappen. Ingen tidsplan: dette er en
# engangsmaaling som skal gjentas naar universet endres, ikke ukentlig.
#
# Tar 15 til 25 minutter. Henter rundt 160 papirer fra Yahoo med pause mellom
# hvert kall, og maaler hvert av dem mot alle 23 raavareseriene.

name: Sonde IKZ-instrumenter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sonde IKZ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sonde_ikz.py
