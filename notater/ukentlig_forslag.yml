# FORSLAG 21.10.2026 (Claude Code, Frodes bestilling). Erstatter
# .github/workflows/ukentlig.yml. Claude Code kan ikke endre arbeidsflytene;
# Frode eller Cowork kopierer denne fila dit, ord for ord.
#
# Endringer mot dagens fil:
#   1. Hovedkjoering onsdag 08:48 norsk tid og reservekjoering 09:56, bort fra
#      hel time (GitHub hoppet over 06:00 UTC 21.10.2026). GitHub regner cron i
#      UTC: tidene under gjelder vintertid (fra 25.10.2026). Ved sommertid
#      (fra 28.03.2027) maa de flyttes en time: "48 6 * * 3" og "56 7 * * 3".
#   2. Jobben «vakt» (vakt_ukentlig.py) lar reserven hoppe over hvis
#      index.json allerede er skrevet i dag. Startet for haand kjoerer alltid.
#   3. «concurrency» sier at en ny kjoering venter til en paagaaende er
#      ferdig, saa reserven aldri gaar samtidig med en forsinket hovedkjoering.
#
# Ukentlig innhenting til Syklusbordet.
#
# Kjorer paa GitHub sine egne maskiner, ikke i Colab. Gratis for offentlige
# repoer. Skriver tilbake til dette repoet med den innebygde token-en, saa
# ingen hemmelighet maa settes opp manuelt.
#
# Onsdag er valgt fordi Fearnleys publiserer tidlig i uka og Verdensbankens
# Pink Sheet kommer de forste virkedagene i maaneden.

name: Ukentlig innhenting

on:
  schedule:
    - cron: "48 7 * * 3"       # onsdag 08:48 norsk vintertid (hovedkjoering)
    - cron: "56 8 * * 3"       # onsdag 09:56 norsk vintertid (reserve, se vakt)
  workflow_dispatch:            # og naar du trykker paa knappen selv

permissions:
  contents: write               # lar jobben skrive JSON-filene tilbake

concurrency:
  group: ukentlig-innhenting
  cancel-in-progress: false     # en ny kjoering venter, den avbryter ikke

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kjor: ${{ steps.vakt.outputs.kjor }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: vakt
        name: Har ukens kjoering allerede gaatt?
        run: python vakt_ukentlig.py

  kapitulasjon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: vakt
    if: needs.vakt.outputs.kjor == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kapitulasjon D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python kapitulasjon_d.py

  priser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: kapitulasjon        # D maa ligge i repoet foer priser.py leser den
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Priser, 24 segmenter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python priser.py

  shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: priser               # sist i koen, saa ingen to skriver samtidig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fearnleys ukerapporter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python shipping.py
      - name: Bygg shipping-segmentene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bygg_shipping.py
