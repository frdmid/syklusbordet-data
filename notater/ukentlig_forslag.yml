# FORSLAG, foerst 21.10.2026, oppdatert 12.11.2026 (Claude Code, Frodes
# bestilling). Erstatter .github/workflows/ukentlig.yml. Claude Code kan ikke
# endre arbeidsflytene; Frode eller Cowork kopierer denne fila dit, ORD FOR ORD.
#
# Endringer mot dagens fil:
#   1. Hovedkjoering onsdag 08:48 norsk tid og reservekjoering 09:56, bort fra
#      hel time (GitHub hoppet over 06:00 UTC 21.10.2026).
#   2. Jobben «vakt» (vakt_ukentlig.py) lar reserven hoppe over hvis
#      index.json allerede er skrevet i dag. Startet for haand kjoerer alltid.
#   3. «concurrency» sier at en ny kjoering venter til en paagaaende er
#      ferdig, saa reserven aldri gaar samtidig med en forsinket hovedkjoering.
#   4. FIRE cron-tider (12.11.2026), ikke to, saa filen virker baade ved
#      vintertid og sommertid uten aa flyttes for haand. GitHub regner cron i
#      UTC, og dagens fil med bare to tider maa endres hver 28. mars og
#      25. oktober. Vakta gjor de overflodige tidene til ingenting: den foerste
#      kjoeringen skriver index.json, og de neste stopper etter vaktjobben.
#      Effekten av de fire: om VINTEREN gaar hovedkjoeringen 07:48 i stedet for
#      08:48, om SOMMEREN 08:48 i stedet for 09:48. Begge er harmlose, fordi
#      alle kildene er forrige dags sluttkurser eller maanedstall, og
#      onsdagsrutinen gaar foerst 10:15.
#   5. RESERVEINSTALLASJON (12.11.2026): feiler pip paa en manglende hjulfil,
#      stopper hele onsdagen. Hvert pip-steg faller derfor tilbake til
#      installasjon uten versjonskrav. requirements.txt har oevre grenser og
#      ikke eksakte pinner nettopp fordi reserven manglet; naar den er paa
#      plass, kan Frode velge aa stramme til. Hva som faktisk kjorte, staar i
#      logg/miljo.csv, med avvik mot config/miljo_kjent.json.
#
# Ukentlig innhenting til Syklusbordet.
#
# Kjorer paa GitHub sine egne maskiner, ikke i Colab. Gratis for offentlige
# repoer. Skriver tilbake til dette repoet med den innebygde token-en, saa
# ingen hemmelighet maa settes opp manuelt.
#
# Onsdag er valgt fordi Fearnleys publiserer tidlig i uka og Verdensbankens
# Pink Sheet kommer de forste virkedagene i maaneden.

name: Ukentlig innhenting

on:
  schedule:
    # Fire tider, to for hver aarstid. Vakta slipper bare den foerste gjennom.
    - cron: "48 6 * * 3"       # 08:48 norsk sommertid (07:48 vintertid)
    - cron: "48 7 * * 3"       # 08:48 norsk vintertid (09:48 sommertid)
    - cron: "56 7 * * 3"       # 09:56 norsk sommertid, reserve (08:56 vintertid)
    - cron: "56 8 * * 3"       # 09:56 norsk vintertid, reserve (10:56 sommertid)
  workflow_dispatch:            # og naar du trykker paa knappen selv

permissions:
  contents: write               # lar jobben skrive JSON-filene tilbake

concurrency:
  group: ukentlig-innhenting
  cancel-in-progress: false     # en ny kjoering venter, den avbryter ikke

jobs:
  vakt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kjor: ${{ steps.vakt.outputs.kjor }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: vakt
        name: Har ukens kjoering allerede gaatt?
        run: python vakt_ukentlig.py

  kapitulasjon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: vakt
    if: needs.vakt.outputs.kjor == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Reserve: feiler pip paa et manglende hjul, stopper hele onsdagen.
      - run: pip install -r requirements.txt || pip install pandas numpy requests openpyxl pdfplumber lxml
      - name: Kapitulasjon D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python kapitulasjon_d.py

  priser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: kapitulasjon        # D maa ligge i repoet foer priser.py leser den
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Reserve: feiler pip paa et manglende hjul, stopper hele onsdagen.
      - run: pip install -r requirements.txt || pip install pandas numpy requests openpyxl pdfplumber lxml
      - name: Priser, 24 segmenter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python priser.py

  shipping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: priser               # sist i koen, saa ingen to skriver samtidig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Reserve: feiler pip paa et manglende hjul, stopper hele onsdagen.
      - run: pip install -r requirements.txt || pip install pandas numpy requests openpyxl pdfplumber lxml
      - name: Fearnleys ukerapporter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python shipping.py
      - name: Bygg shipping-segmentene
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bygg_shipping.py
